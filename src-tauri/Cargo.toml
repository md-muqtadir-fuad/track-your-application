[package]
name = "track-your-phd-application"
version = "0.1.0"
description = "Track Your PhD Application desktop app"
authors = ["Md Muqtadir Fuad <mmfuad01@gmail.com>"]
edition = "2021"

[lib]
name = "track_your_phd_application_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
